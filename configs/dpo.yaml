base_config: configs/base.yaml

beta: 0.10
betas: [0.03, 0.10, 0.30]

learning_rate: 2.0e-5
weight_decay: 0.0

# Training uses two preference pairs per microbatch.
batch_size: 2

# Evaluation uses one example at a time to stay within
# the 6 GiB GPU memory limit on long sequences.
evaluation_batch_size: 1

grad_accum_steps: 8
epochs: 1
short_ablation_examples: 600

max_sequence_length: 768
max_generation_tokens: 256
max_grad_norm: 1.0

standard_output: outputs/task1_dpo/standard
length_output: outputs/task1_dpo/length_balanced
results_dir: results/task1_dpo